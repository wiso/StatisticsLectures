name: notebooks

# Execute the notebooks and fail if any cell raises.
# By default only the notebooks changed by the push / pull request are re-executed.
# The environment is the one in environment.yml (micromamba), the same used locally.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
    inputs:
      notebooks:
        description: "Notebooks to execute (empty = all), space separated"
        type: string
        default: ""

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  select:
    name: select notebooks
    runs-on: ubuntu-latest
    outputs:
      notebooks: ${{ steps.pick.outputs.notebooks }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the diff needs the history

      - id: pick
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
          REQUESTED: ${{ inputs.notebooks }}
        run: |
          set -euo pipefail

          all_notebooks() { git ls-files 'Lecture*.ipynb'; }

          if [ "$EVENT" = "workflow_dispatch" ]; then
            if [ -n "$REQUESTED" ]; then
              selected="$REQUESTED"
            else
              selected=$(all_notebooks)
            fi
          else
            if [ "$EVENT" = "pull_request" ]; then
              base="$PR_BASE"; head="$PR_HEAD"
            else
              base="$PUSH_BEFORE"; head="$PUSH_AFTER"
            fi

            # first push of a branch, force push or initial commit: no usable base
            if ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
              echo "base '$base' not available: executing all notebooks"
              selected=$(all_notebooks)
            else
              changed=$(git diff --name-only "$base" "$head")
              echo "Changed files:"; echo "$changed" | sed 's/^/  /'

              # a change in the environment, in an input file or in the CI itself
              # can change the result of every notebook
              if echo "$changed" | grep -qE '^(environment\.yml|ci/.*|\.github/workflows/notebooks\.yml|custom\.css|.*\.(root|C|py))$'; then
                echo "Environment, CI or input file changed: executing all notebooks"
                selected=$(all_notebooks)
              else
                selected=$(echo "$changed" | grep -E '^Lecture[0-9]+\.ipynb$' || true)
                # Lecture3 reads onoff.root, which Lecture2 writes: if Lecture2
                # changes, execute Lecture3 as well (the file is versioned anyway).
                if echo "$selected" | grep -q '^Lecture2\.ipynb$'; then
                  selected=$(printf '%s\nLecture3.ipynb\n' "$selected")
                fi
              fi
            fi
          fi

          selected=$(printf '%s\n' $selected | sort -u | sed '/^$/d')
          if [ -z "$selected" ]; then
            echo "No notebook to execute"
            echo 'notebooks=[]' >> "$GITHUB_OUTPUT"
          else
            echo "Selected notebooks:"; echo "$selected" | sed 's/^/  /'
            json=$(printf '%s\n' "$selected" | jq -R . | jq -sc .)
            echo "notebooks=$json" >> "$GITHUB_OUTPUT"
          fi

  run:
    name: ${{ matrix.notebook }}
    needs: select
    if: needs.select.outputs.notebooks != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        notebook: ${{ fromJSON(needs.select.outputs.notebooks) }}
    steps:
      - uses: actions/checkout@v4

      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: environment.yml
          cache-environment: true

      - name: versions
        shell: bash -el {0}
        run: |
          python -c "import ROOT, numpy, scipy, matplotlib, pandas, ipywidgets; print('ROOT', ROOT.__version__)"
          python -c "import nbclient, nbformat; print('nbclient', nbclient.__version__)"
          dot -V   # graphviz, used by the graphVizTree cells

      - name: execute ${{ matrix.notebook }}
        shell: bash -el {0}
        env:
          MPLBACKEND: Agg   # ROOT falls back to batch mode by itself, no DISPLAY needed
        run: |
          python ci/execute_notebook.py "${{ matrix.notebook }}" \
            --output "executed/${{ matrix.notebook }}" --timeout 3600

      - name: upload executed notebook
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: executed-${{ matrix.notebook }}
          path: executed/
          if-no-files-found: warn
