# Main environment for the lectures (includes ROOT and graphviz).
#   micromamba env create -f environment.yml
#   micromamba activate statisticslectures
name: statisticslectures
channels:
  - conda-forge
dependencies:
  - python=3.13
  - root>=6.36
  - graphviz
  - numpy
  - scipy
  - pandas
  - matplotlib
  - sympy
  - ipykernel
  - ipywidgets
  - jupyterlab>=4.2
  - notebook>=7
  - jupyterlab_rise
variables:
  # ignore packages installed with `pip install --user` (~/.local), which can shadow the env
  PYTHONNOUSERSITE: "1"
